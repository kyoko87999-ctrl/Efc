<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<title>EFC - Elite Fighters Championship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,600;0,800;1,800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #07080c; overflow: hidden; color: #fff; }
  #app { position: fixed; inset: 0; }
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
<style>
:root {
  --gold: #ffc94a; --gold2: #ff9d1a; --red: #ff3b3b; --cyan: #37e6ff; --green: #47ff9a; --violet: #a86bff;
  --bg: #07080c; --panel: rgba(10, 12, 20, .84); --line: rgba(255, 255, 255, .16);
  --fs: clamp(11px, 1.9vmin, 22px);
  font-size: var(--fs);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { font-family: 'Kanit', 'Rajdhani', 'Segoe UI', Tahoma, system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
button { font-family: inherit; }
#app { font-size: var(--fs); }
#hud, #ui, #touch, #toast { position: absolute; inset: 0; pointer-events: none; }
#ui { z-index: 20; }
#touch { z-index: 30; }
#toast { z-index: 60; }
#hud { z-index: 10; }
[hidden] { display: none !important; }

/* ======================================================== HUD */
.hud-top { position: absolute; top: 2.2vh; left: 2%; right: 2%; height: 12vh; display: flex; justify-content: center; align-items: flex-start; }
.pl { position: relative; width: 41%; }
.p1 { margin-right: 1%; } .p2 { margin-left: 1%; }
.pl-head { display: flex; align-items: baseline; gap: .8em; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; text-shadow: 0 2px 4px #000; margin-bottom: .2em; font-size: 1.15em; }
.p2 .pl-head { flex-direction: row-reverse; }
.pl-head .rk { font-size: .7em; color: var(--gold); opacity: .9; }
.hpbar { position: relative; height: 3.4vh; background: rgba(0, 0, 0, .65); border: .17em solid #e9edf5; transform: skewX(-20deg); overflow: hidden; box-shadow: 0 0 .8em rgba(0, 0, 0, .7), inset 0 0 .6em #000; }
.p2 .hpbar { transform: skewX(20deg); }
.hpbar > div { position: absolute; inset: 0; transition: none; }
.p1 .hpbar > div { transform-origin: right center; } .p2 .hpbar > div { transform-origin: left center; }
.hp-ghost { background: linear-gradient(#fff, #ffd9a0); opacity: .85; }
.hp-rec { background: repeating-linear-gradient(115deg, rgba(255, 255, 255, .55) 0 .35em, rgba(255, 255, 255, .15) .35em .7em); }
.hp-fill { background: linear-gradient(#8bff9f, #21c65a 60%, #12873a); }
.hp-fill[data-lv=mid] { background: linear-gradient(#fff08a, #f2c318 60%, #b88a08); }
.hp-fill[data-lv=low] { background: linear-gradient(#ff8a8a, #e02525 60%, #8f1010); animation: lowpulse .5s infinite alternate; }
@keyframes lowpulse { to { filter: brightness(1.4); } }
.hp-grid { background: repeating-linear-gradient(90deg, transparent 0 9.9%, rgba(0, 0, 0, .55) 9.9% 10%); }
.rage-tag { position: absolute; top: 50%; transform: translateY(-50%) skewX(20deg); font-weight: 800; color: #fff; text-shadow: 0 0 .5em #f00; letter-spacing: .1em; font-size: .8em; opacity: 0; transition: opacity .2s; }
.p1 .rage-tag { left: 3%; transform: translateY(-50%) skewX(20deg); } .p2 .rage-tag { right: 3%; transform: translateY(-50%) skewX(-20deg); }
.pl.rage .hpbar { border-color: #ff4a4a; animation: ragebar .45s infinite alternate; }
.pl.rage .rage-tag { opacity: 1; }
@keyframes ragebar { from { box-shadow: 0 0 .5em #f22, inset 0 0 .5em #a00; } to { box-shadow: 0 0 1.6em #f22, inset 0 0 1.2em #f44; } }
.sub { display: flex; align-items: center; gap: 1em; margin-top: .45em; }
.p2 .sub { flex-direction: row-reverse; }
.heatbar { position: relative; width: 52%; height: 1.05vh; background: rgba(0, 0, 0, .6); border: .12em solid #777; transform: skewX(-20deg); overflow: hidden; }
.p2 .heatbar { transform: skewX(20deg); }
.heat-fill { position: absolute; inset: 0; background: linear-gradient(90deg, #ff5a1a, #ffb42e, #fff08a); }
.p1 .heat-fill { transform-origin: left center; } .p2 .heat-fill { transform-origin: right center; }
.heat-label { position: absolute; top: -.1em; font-size: .62em; font-weight: 800; letter-spacing: .12em; color: #fff; text-shadow: 0 1px 2px #000; left: 6%; transform: skewX(20deg); line-height: 1.7; }
.p2 .heat-label { left: auto; right: 6%; transform: skewX(-20deg); }
.heatbar.ready { border-color: var(--gold); box-shadow: 0 0 .9em var(--gold2); animation: heatready .8s infinite alternate; }
@keyframes heatready { to { box-shadow: 0 0 .2em var(--gold2); } }
.heatbar.on { border-color: #ff7a1a; box-shadow: 0 0 1.2em #ff6a00; }
.heatbar.on .heat-fill { animation: heatflow .3s infinite alternate; }
@keyframes heatflow { to { filter: brightness(1.35) saturate(1.3); } }
.heatbar.used { border-color: #444; }
.pips { display: flex; gap: .35em; } .p2 .pips { flex-direction: row-reverse; }
.pips i { width: 1.05em; height: 1.05em; border-radius: 50%; border: .15em solid var(--gold); background: rgba(0, 0, 0, .5); display: block; }
.pips i.w { background: radial-gradient(circle at 35% 30%, #fff6c8, var(--gold) 55%, #b8770a); box-shadow: 0 0 .7em var(--gold2); }
.timer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 12%; text-align: center; font-family: 'Rajdhani', 'Kanit', sans-serif; z-index: 2; }
.timer span { display: block; font-size: 5.6vh; font-weight: 800; line-height: 1; color: #fff; text-shadow: 0 0 .4em #000, 0 3px 0 #000; }
.timer.warn span { color: #ff5a5a; animation: warn .5s infinite alternate; }
@keyframes warn { to { transform: scale(1.12); } }

.combo { position: absolute; top: 26vh; opacity: 0; transition: opacity .25s; text-align: center; font-weight: 800; text-shadow: 0 3px 0 #000, 0 0 .6em #000; }
.combo.c1 { left: 4%; } .combo.c2 { right: 4%; }
.combo.show { opacity: 1; }
.combo b { display: block; font-size: 7.5vh; line-height: 1; color: var(--gold); font-style: italic; -webkit-text-stroke: .04em #7a3a00; }
.combo i { font-size: 2.4vh; letter-spacing: .3em; font-style: normal; color: #fff; }
.combo em { display: block; font-size: 2.6vh; color: #ff9d1a; font-style: normal; }
.combo.pop b { animation: pop .25s ease-out; }
@keyframes pop { 0% { transform: scale(1.7); } 100% { transform: scale(1); } }
.tags { position: absolute; top: 40vh; display: flex; flex-direction: column; gap: .4em; }
.tags.t1 { left: 3%; align-items: flex-start; } .tags.t2 { right: 3%; align-items: flex-end; }
.tag { font-weight: 800; font-style: italic; font-size: 3.2vh; padding: .05em .7em; background: linear-gradient(90deg, rgba(0, 0, 0, .75), rgba(0, 0, 0, .1)); border-left: .2em solid var(--gold); text-shadow: 0 2px 0 #000; animation: tagin 1.4s forwards; letter-spacing: .04em; }
.t2 .tag { background: linear-gradient(-90deg, rgba(0, 0, 0, .75), rgba(0, 0, 0, .1)); border-left: 0; border-right: .2em solid var(--gold); }
.tag.counter { color: #ff5d7a; border-color: #ff5d7a; } .tag.punish { color: var(--gold); } .tag.break { color: var(--cyan); border-color: var(--cyan); }
.tag.parry { color: #b6ff70; border-color: #b6ff70; } .tag.crush { color: #ffe066; } .tag.wall { color: #ffd6a0; border-color: #ff9d1a; }
.tag.heat { color: #ff9d3a; border-color: #ff7a1a; } .tag.rage { color: #ff4d4d; border-color: #ff2a2a; }
@keyframes tagin { 0% { transform: translateX(-30%) scale(1.3); opacity: 0; } 12% { transform: none; opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
.t2 .tag { animation-name: tagin2; }
@keyframes tagin2 { 0% { transform: translateX(30%) scale(1.3); opacity: 0; } 12% { transform: none; opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

.banner { position: absolute; left: 0; right: 0; top: 33%; text-align: center; font-weight: 800; font-style: italic; font-size: 15vh; line-height: 1; opacity: 0; letter-spacing: .03em;
  background: linear-gradient(#fff 20%, var(--gold) 60%, #ff7a00); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 .05em 0 #000) drop-shadow(0 0 .35em rgba(255, 150, 0, .6)); }
.banner.show { animation: bannerin 1.4s cubic-bezier(.2, .9, .2, 1) forwards; }
.banner.ko { background: linear-gradient(#fff 10%, #ff6a6a 50%, #b00000); -webkit-background-clip: text; background-clip: text; font-size: 22vh; }
.banner.small { font-size: 9vh; }
.banner.perfect { background: linear-gradient(#fff, #8ff, #3af); -webkit-background-clip: text; background-clip: text; font-size: 13vh; }
.banner.wb { font-size: 11vh; background: linear-gradient(#fff, #ffb, #f80); -webkit-background-clip: text; background-clip: text; }
@keyframes bannerin { 0% { transform: scale(2.4); opacity: 0; } 14% { transform: scale(1); opacity: 1; } 78% { opacity: 1; transform: scale(1.03); } 100% { opacity: 0; transform: scale(1.12); } }
.dmgnums { position: absolute; inset: 0; overflow: hidden; }
.dn { position: absolute; transform: translate(-50%, -50%); font-family: 'Rajdhani', sans-serif; font-weight: 800; font-size: 3.6vh; color: #fff; text-shadow: 0 0 .3em #000, 0 2px 0 #000; animation: dnfloat .9s ease-out forwards; }
.dn.heavy { font-size: 5vh; color: #ffd06a; } .dn.ch { color: #ff7a9a; font-size: 4.6vh; }
@keyframes dnfloat { 0% { transform: translate(-50%, -30%) scale(1.5); opacity: 0; } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1); } 100% { transform: translate(-50%, -190%); opacity: 0; } }
.fps { position: absolute; right: .5em; bottom: .5em; font: 12px monospace; color: #9f9; }
.nohud .hud-top, .nohud .combo, .nohud .tags { display: none; }

.practice-hud .fd { position: absolute; bottom: 4vh; min-width: 24vw; padding: .5em .9em; background: var(--panel); border: 1px solid var(--line); font-size: .85em; line-height: 1.5; }
.practice-hud .fd1 { left: 2%; } .practice-hud .fd2 { right: 2%; text-align: right; }
.practice-hud .fd b { color: var(--gold); font-size: 1.15em; margin-right: .5em; }
.practice-hud .fd span { display: inline-block; margin-right: .8em; opacity: .9; }
.meas { font-weight: 800; font-size: 1.4em; margin-top: .3em; } .meas.plus { color: var(--green); } .meas.minus { color: #ff6a6a; }
.inlog { position: absolute; top: 22vh; width: 13vw; font-family: 'Rajdhani', monospace; font-size: .9em; display: flex; flex-direction: column; gap: 1px; opacity: .92; }
.il1 { left: 1%; } .il2 { right: 1%; align-items: flex-end; }
.inlog > div { display: flex; align-items: center; gap: .3em; background: rgba(0, 0, 0, .45); padding: 0 .4em; height: 1.5em; }
.inlog .ar { width: 1.3em; text-align: center; font-weight: 800; color: #fff; }
.inlog .bt { width: 1.35em; height: 1.35em; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: .8em; font-weight: 800; color: #111; }
.inlog .b1 { background: #ff9ad0; } .inlog .b2 { background: #ffd06a; } .inlog .b3 { background: #6ad7ff; } .inlog .b4 { background: #7dff9a; }
.inlog em { margin-left: auto; opacity: .6; font-style: normal; font-size: .8em; }

/* ======================================================== screens */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: none; color: #fff; animation: scrin .25s ease-out; }
.screen > * { pointer-events: auto; }
@keyframes scrin { from { opacity: 0; transform: translateY(1.2em); } }
.screen.dark { background: radial-gradient(ellipse at center, rgba(4, 6, 12, .55), rgba(4, 6, 12, .93)); pointer-events: auto; }
.screen.veil { background: linear-gradient(90deg, rgba(5, 6, 12, .93) 0%, rgba(5, 6, 12, .74) 32%, rgba(5, 6, 12, 0) 62%); }
h1.title { margin: 0; font-size: 2.6em; font-weight: 800; font-style: italic; letter-spacing: .06em; text-transform: uppercase; text-shadow: 0 .06em 0 #000; }
h2.sub { margin: 0; font-size: 1.15em; font-weight: 500; opacity: .75; letter-spacing: .12em; text-transform: uppercase; }
.crumb { position: absolute; top: 2.2vh; left: 2.2vw; font-size: 1.05em; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.hint { position: absolute; bottom: 1.6vh; left: 0; right: 0; text-align: center; font-size: .85em; opacity: .75; letter-spacing: .05em; pointer-events: none; }
.hint kbd { background: #222b3a; border: 1px solid #556; border-bottom-width: 2px; border-radius: .3em; padding: 0 .4em; margin: 0 .2em; font-family: inherit; }
.btn { display: inline-block; padding: .55em 1.5em; background: linear-gradient(#2b3346, #1a2030); border: 1px solid #58627a; color: #fff; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; transform: skewX(-12deg); margin: .3em; }
.btn > * { display: inline-block; transform: skewX(12deg); }
.btn:hover, .btn.focus { background: linear-gradient(#ffd66b, #ff9d1a); color: #111; border-color: #fff; }
.btn.danger.focus, .btn.danger:hover { background: linear-gradient(#ff8a8a, #e02525); }

/* title */
.title-screen { align-items: center; justify-content: center; text-align: center; background: radial-gradient(ellipse at center, rgba(3, 4, 8, .1), rgba(3, 4, 8, .82)); pointer-events: auto; }
.logo { font-size: 13vh; font-weight: 800; font-style: italic; line-height: .95; letter-spacing: .04em; background: linear-gradient(#fff 12%, #ffe27a 42%, #ff8a00 70%, #b02a00); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 .05em 0 #000) drop-shadow(0 0 .3em rgba(255, 130, 0, .55)); animation: logo 2.4s ease-in-out infinite alternate; }
@keyframes logo { to { filter: drop-shadow(0 .05em 0 #000) drop-shadow(0 0 .6em rgba(255, 170, 0, .9)); transform: scale(1.02); } }
.logo-sub { font-size: 2.3vh; letter-spacing: .55em; margin-top: .6em; text-transform: uppercase; opacity: .92; text-shadow: 0 2px 0 #000; }
.press { margin-top: 9vh; font-size: 2.4vh; letter-spacing: .3em; animation: blink 1.1s infinite; text-shadow: 0 0 .6em #000; font-weight: 600; }
@keyframes blink { 50% { opacity: .2; } }
.ver { position: absolute; bottom: 1.6vh; right: 2vw; opacity: .5; font-size: .8em; }
.lang-toggle { position: absolute; top: 2vh; right: 2vw; }

/* menus */
.menu-screen { padding: 6vh 0 0 4vw; }
.menu-list { margin-top: 3vh; display: flex; flex-direction: column; gap: .25em; width: 30vw; min-width: 260px; max-height: 76vh; overflow-y: auto; scrollbar-width: none; }
.menu-list::-webkit-scrollbar { display: none; }
.mi { position: relative; padding: .5em 1.6em .5em 1.1em; font-size: 1.35em; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: linear-gradient(90deg, rgba(20, 24, 36, .82), rgba(20, 24, 36, .35)); border-left: .25em solid #3a4358; cursor: pointer; transform: skewX(-10deg); transform-origin: left; transition: transform .12s, background .12s; }
.mi > span { display: inline-block; transform: skewX(10deg); }
.mi small { display: block; font-size: .5em; font-weight: 500; opacity: .7; letter-spacing: .05em; text-transform: none; }
.mi.focus, .mi:hover { background: linear-gradient(90deg, #ffd66b, #ff9d1a 70%, rgba(255, 157, 26, .5)); color: #10131c; border-left-color: #fff; transform: skewX(-10deg) translateX(1.2em); }
.mi.off { opacity: .4; }
.mi .val { float: right; margin-left: 1.5em; font-weight: 600; color: var(--gold); }
.mi.focus .val, .mi:hover .val { color: #10131c; }
.side-info { position: absolute; right: 3vw; top: 8vh; width: 28vw; padding: 1.2em 1.4em; background: var(--panel); border: 1px solid var(--line); border-top: .25em solid var(--gold); }
.side-info h3 { margin: 0 0 .4em; font-size: 1.4em; color: var(--gold); text-transform: uppercase; letter-spacing: .06em; }
.side-info p { margin: .3em 0; opacity: .88; line-height: 1.5; }

/* character select */
.sel { justify-content: space-between; }
.sel .crumb { z-index: 2; }
.pcard { position: absolute; top: 7vh; width: 26vw; padding: .9em 1.1em; background: linear-gradient(180deg, rgba(8, 10, 18, .88), rgba(8, 10, 18, .55)); border-top: .25em solid var(--c, var(--gold)); }
.pcard.l { left: 2vw; } .pcard.r { right: 2vw; text-align: right; }
.pcard .who { font-size: .8em; letter-spacing: .25em; opacity: .7; text-transform: uppercase; }
.pcard .nm { font-size: 2.1em; font-weight: 800; font-style: italic; line-height: 1.05; text-transform: uppercase; text-shadow: 0 .05em 0 #000; }
.pcard .ttl { color: var(--c, var(--gold)); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: .95em; }
.pcard .sty { opacity: .8; font-size: .85em; margin-bottom: .5em; }
.stat { display: grid; grid-template-columns: 5.2em 1fr; align-items: center; gap: .5em; font-size: .78em; text-transform: uppercase; letter-spacing: .08em; margin: .18em 0; }
.pcard.r .stat { direction: rtl; } .pcard.r .stat > * { direction: ltr; }
.stat .bar { height: .7em; background: rgba(255, 255, 255, .12); transform: skewX(-20deg); display: flex; gap: 2px; }
.stat .bar i { flex: 1; background: rgba(255, 255, 255, .1); } .stat .bar i.on { background: linear-gradient(var(--c, var(--gold)), color-mix(in srgb, var(--c, var(--gold)) 60%, #000)); }
.pcard .alts { margin-top: .6em; display: flex; gap: .4em; flex-wrap: wrap; } .pcard.r .alts { justify-content: flex-end; }
.pcard .alt { padding: .15em .7em; font-size: .75em; border: 1px solid #58627a; background: rgba(0, 0, 0, .5); cursor: pointer; transform: skewX(-12deg); }
.pcard .alt.on { background: var(--c, var(--gold)); color: #111; font-weight: 700; }
.grid { align-self: center; margin-bottom: 5.5vh; display: grid; grid-template-columns: repeat(5, 1fr); gap: .5em; padding: .8em; background: rgba(6, 8, 14, .78); border: 1px solid var(--line); }
.tile { position: relative; width: 11.5vh; height: 11.5vh; background: #141926 center/cover no-repeat; border: .17em solid #3a4358; cursor: pointer; overflow: hidden; }
.tile .nm { position: absolute; left: 0; right: 0; bottom: 0; padding: .1em .3em; font-size: .68em; font-weight: 700; text-transform: uppercase; background: linear-gradient(transparent, rgba(0, 0, 0, .9)); text-align: center; letter-spacing: .05em; }
.tile .flag { position: absolute; top: .15em; padding: 0 .4em; font-size: .7em; font-weight: 800; color: #111; }
.tile .f1 { left: .15em; background: #ff6a3a; } .tile .f2 { right: .15em; background: #37c0ff; }
.tile.h1 { border-color: #ff6a3a; box-shadow: 0 0 1em #ff6a3a; } .tile.h2 { border-color: #37c0ff; box-shadow: 0 0 1em #37c0ff; }
.tile.h1.h2 { border-image: linear-gradient(90deg, #ff6a3a, #37c0ff) 1; }
.tile.rnd { display: flex; align-items: center; justify-content: center; font-size: 3em; font-weight: 800; color: var(--gold); }

/* stage select */
.stagerow { align-self: center; margin-bottom: 7vh; display: flex; gap: .7em; padding: 1em; overflow-x: auto; max-width: 94vw; scrollbar-width: none; }
.stagecard { flex: 0 0 15vw; height: 20vh; position: relative; border: .17em solid #3a4358; background-size: cover; background-position: center; cursor: pointer; overflow: hidden; transform: skewX(-6deg); }
.stagecard .nm { position: absolute; left: 0; right: 0; bottom: 0; padding: .4em .7em; font-weight: 800; text-transform: uppercase; background: linear-gradient(transparent, rgba(0, 0, 0, .92)); font-size: .95em; }
.stagecard.focus { border-color: var(--gold); box-shadow: 0 0 1.2em var(--gold2); transform: skewX(-6deg) scale(1.06); z-index: 2; }
.stagedesc { position: absolute; top: 9vh; left: 0; right: 0; text-align: center; }
.stagedesc h1 { font-size: 3.2em; } .stagedesc p { opacity: .85; margin: .3em; }

/* VS splash */
.vs { position: absolute; inset: 0; overflow: hidden; background: #05060a; z-index: 40; pointer-events: auto; }
.vs .half { position: absolute; top: 0; bottom: 0; width: 60%; display: flex; flex-direction: column; justify-content: center; padding: 0 5%; animation: vsl .5s cubic-bezier(.2, .9, .2, 1); }
.vs .h1 { left: 0; clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%); background: linear-gradient(120deg, #6a1a08, #1a0a06 70%); }
.vs .h2 { right: 0; clip-path: polygon(20% 0, 100% 0, 100% 100%, 0 100%); background: linear-gradient(240deg, #08386a, #060e1a 70%); text-align: right; animation-name: vsr; align-items: flex-end; }
@keyframes vsl { from { transform: translateX(-60%); } } @keyframes vsr { from { transform: translateX(60%); } }
.vs .who { font-size: 1em; letter-spacing: .4em; opacity: .7; }
.vs .big { font-size: 8vh; font-weight: 800; font-style: italic; text-transform: uppercase; line-height: 1; text-shadow: 0 .05em 0 #000; }
.vs .ttl { font-size: 3vh; color: var(--gold); letter-spacing: .15em; text-transform: uppercase; margin-top: .3em; }
.vs .ic { position: absolute; bottom: 0; height: 88%; aspect-ratio: 1; background-size: cover; background-position: center top; opacity: .95; mask-image: linear-gradient(transparent, #000 25%); }
.vs .h1 .ic { right: 10%; } .vs .h2 .ic { left: 10%; }
.vs .mid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) skewX(-10deg); font-size: 22vh; font-weight: 800; font-style: italic; color: #fff; text-shadow: 0 0 .3em #ff9d1a, 0 .05em 0 #000; animation: vsmid .6s .3s both cubic-bezier(.2, 1.6, .4, 1); z-index: 3; }
@keyframes vsmid { from { transform: translate(-50%, -50%) scale(4); opacity: 0; } }
.vs .stg { position: absolute; bottom: 5vh; left: 0; right: 0; text-align: center; font-size: 2.4vh; letter-spacing: .5em; text-transform: uppercase; opacity: .85; z-index: 3; }

/* pause / dialogs */
.dialog { margin: auto; min-width: 30vw; max-width: 90vw; padding: 1.2em 1.6em; background: var(--panel); border: 1px solid var(--line); border-top: .25em solid var(--gold); }
.dialog h2 { margin: 0 0 .6em; font-size: 1.6em; text-transform: uppercase; letter-spacing: .08em; font-style: italic; }
.dialog .menu-list { width: 100%; margin: 0; max-height: 60vh; }
.dialog .mi { font-size: 1.1em; }

/* results */
.results { align-items: center; justify-content: center; }
.res-card { width: min(70vw, 900px); padding: 1.4em 1.8em; background: var(--panel); border: 1px solid var(--line); border-top: .3em solid var(--gold); }
.res-title { font-size: 4vh; font-weight: 800; font-style: italic; text-transform: uppercase; color: var(--gold); text-shadow: 0 .06em 0 #000; }
.res-quote { opacity: .85; font-style: italic; margin: .4em 0 1em; }
.res-table { width: 100%; border-collapse: collapse; font-size: .95em; }
.res-table td { padding: .28em .6em; border-bottom: 1px solid var(--line); } .res-table td:nth-child(2) { text-align: center; font-weight: 700; color: var(--gold); } .res-table td:nth-child(1), .res-table td:nth-child(3) { width: 30%; }
.res-table th { text-align: center; opacity: .7; font-weight: 600; letter-spacing: .1em; }
.res-actions { margin-top: 1em; display: flex; flex-wrap: wrap; justify-content: center; }
.reward { color: var(--green); font-weight: 700; margin-top: .6em; }

/* story / dialogue */
.story-box { position: absolute; left: 6vw; right: 6vw; bottom: 6vh; padding: 1em 1.4em 1.3em; background: linear-gradient(180deg, rgba(6, 8, 14, .92), rgba(6, 8, 14, .82)); border: 1px solid var(--line); border-left: .35em solid var(--c, var(--gold)); min-height: 18vh; pointer-events: auto; }
.story-box .spk { font-weight: 800; font-size: 1.3em; color: var(--c, var(--gold)); text-transform: uppercase; letter-spacing: .1em; font-style: italic; }
.story-box .txt { font-size: 1.25em; line-height: 1.6; margin-top: .3em; }
.story-box .nx { position: absolute; right: 1em; bottom: .4em; animation: blink 1s infinite; opacity: .8; }
.chapter { align-items: center; justify-content: center; text-align: center; background: rgba(2, 3, 6, .88); pointer-events: auto; }
.chapter h1 { font-size: 7vh; color: var(--gold); } .chapter p { font-size: 1.4em; opacity: .85; max-width: 60vw; line-height: 1.6; }

/* options */
.opt-wrap { margin: auto; width: min(76vw, 980px); max-height: 88vh; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-top: .3em solid var(--gold); padding: 1em 1.4em; }
.tabs { display: flex; gap: .3em; margin-bottom: .6em; flex-wrap: wrap; }
.tab { padding: .3em 1.2em; background: #1b2232; border: 1px solid #3a4358; cursor: pointer; text-transform: uppercase; font-weight: 700; letter-spacing: .06em; transform: skewX(-12deg); }
.tab > * { display: inline-block; transform: skewX(12deg); }
.tab.on { background: var(--gold); color: #111; }
.opt-list { overflow-y: auto; padding-right: .4em; scrollbar-width: thin; }
.row { display: flex; align-items: center; justify-content: space-between; padding: .45em .8em; border-left: .2em solid transparent; gap: 1em; }
.row.focus, .row:hover { background: rgba(255, 201, 74, .12); border-left-color: var(--gold); }
.row .lab { font-weight: 600; letter-spacing: .04em; } .row .lab small { display: block; opacity: .55; font-weight: 400; }
.row .ctl { display: flex; align-items: center; gap: .5em; min-width: 14em; justify-content: flex-end; }
.row input[type=range] { width: 11em; accent-color: var(--gold); }
.row input[type=color] { width: 3em; height: 1.8em; border: 1px solid #667; background: none; padding: 0; }
.sw { padding: .1em .9em; border: 1px solid #58627a; background: #141a28; cursor: pointer; min-width: 5em; text-align: center; font-weight: 700; }
.sw.on { background: var(--gold); color: #111; }
.keycap { padding: .1em .7em; border: 1px solid #58627a; background: #141a28; min-width: 5.5em; text-align: center; cursor: pointer; font-family: 'Rajdhani', monospace; font-weight: 700; }
.keycap.wait { background: var(--red); animation: blink .5s infinite; }

/* move list */
.ml { flex-direction: row; padding: 6vh 2vw 4vh; gap: 1.2vw; }
.ml-side { width: 22vw; display: flex; flex-direction: column; gap: .5em; }
.ml-main { flex: 1; background: var(--panel); border: 1px solid var(--line); border-top: .25em solid var(--gold); display: flex; flex-direction: column; min-width: 0; }
.ml-head { padding: .8em 1em; border-bottom: 1px solid var(--line); display: flex; gap: .3em; flex-wrap: wrap; align-items: center; }
.ml-table { overflow-y: auto; flex: 1; font-size: .92em; }
.ml-row { display: grid; grid-template-columns: 13em 1fr 4em 3.6em 4em 4em 4em; gap: .5em; padding: .32em 1em; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, .06); cursor: pointer; }
.ml-row:hover, .ml-row.focus { background: rgba(255, 201, 74, .16); }
.ml-row.hd { position: sticky; top: 0; background: #131826; font-size: .75em; text-transform: uppercase; letter-spacing: .1em; opacity: .85; cursor: default; }
.ml-row .cmd { font-family: 'Rajdhani', monospace; font-weight: 800; letter-spacing: .04em; color: #fff; }
.ml-row .cmd b { color: var(--gold); } .ml-row .nm { opacity: .9; }
.lv { text-align: center; font-weight: 800; } .lv.h { color: #ff9a9a; } .lv.m { color: #ffd66b; } .lv.l { color: #7fdcff; } .lv.t { color: #b6ff70; }
.adv.p { color: var(--green); } .adv.n { color: #ff8a8a; }
.ml-sec { padding: .4em 1em; background: rgba(255, 201, 74, .12); font-weight: 800; text-transform: uppercase; letter-spacing: .12em; font-size: .85em; color: var(--gold); position: sticky; top: 1.7em; }

/* tutorial */
.tut { position: absolute; top: 12vh; left: 50%; transform: translateX(-50%); width: min(60vw, 720px); padding: .8em 1.2em; background: var(--panel); border: 1px solid var(--line); border-left: .3em solid var(--cyan); pointer-events: none; }
.tut h3 { margin: 0; color: var(--cyan); text-transform: uppercase; letter-spacing: .1em; font-size: 1em; }
.tut p { margin: .3em 0 0; font-size: 1.15em; line-height: 1.5; }
.tut .prog { margin-top: .4em; height: .35em; background: rgba(255, 255, 255, .15); } .tut .prog i { display: block; height: 100%; background: var(--cyan); }
.tut.done { border-left-color: var(--green); } .tut.done h3 { color: var(--green); }

/* customize */
.cust { flex-direction: row; padding: 6vh 2vw; }
.cust-panel { width: 30vw; margin-left: auto; background: var(--panel); border: 1px solid var(--line); border-top: .25em solid var(--gold); padding: 1em 1.2em; overflow-y: auto; max-height: 88vh; }

/* toast */
.toast { position: absolute; top: 3vh; left: 50%; transform: translateX(-50%); padding: .5em 1.4em; background: rgba(10, 12, 20, .92); border: 1px solid var(--gold); color: var(--gold); font-weight: 700; letter-spacing: .06em; animation: toast 2.2s forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -1em); } 10% { opacity: 1; transform: translate(-50%, 0); } 85% { opacity: 1; } 100% { opacity: 0; } }
.loading { align-items: center; justify-content: center; background: #05060a; pointer-events: auto; font-size: 1.4em; letter-spacing: .3em; }
.loading i { display: block; width: 14em; height: .3em; background: #222; margin-top: 1em; overflow: hidden; } .loading i b { display: block; height: 100%; background: var(--gold); width: 30%; animation: ld 1s infinite linear; }
@keyframes ld { from { margin-left: -30%; } to { margin-left: 100%; } }
.portrait-cap { position: absolute; width: 1px; height: 1px; opacity: 0; }

/* ======================================================== touch controls */
#touch .tc-stick, #touch .tc-btns, #touch .tc-macros, #touch .tc-pause { display: none; }
#touch.show .tc-stick, #touch.show .tc-btns, #touch.show .tc-macros, #touch.show .tc-pause { display: block; }
.tc-stick { position: absolute; left: 0; bottom: 0; width: 42%; height: 62%; pointer-events: auto; touch-action: none; }
.tc-base { position: absolute; left: 22%; bottom: 20%; width: 9.5em; height: 9.5em; margin: -4.75em 0 0 -4.75em; border-radius: 50%; border: .2em solid rgba(255, 255, 255, .35); background: rgba(20, 24, 36, .35); }
.tc-stick .tc-base { top: auto; }
.tc-knob { position: absolute; left: 50%; top: 50%; width: 4.4em; height: 4.4em; margin: -2.2em; border-radius: 50%; background: rgba(255, 255, 255, .35); border: .15em solid rgba(255, 255, 255, .7); }
.tc-btns { position: absolute; right: 3%; bottom: 8%; width: 17em; height: 17em; pointer-events: none; }
.tc-b { position: absolute; width: 6.6em; height: 6.6em; border-radius: 50%; border: .2em solid rgba(255, 255, 255, .6); background: rgba(20, 24, 36, .45); color: #fff; font-size: 1.1em; font-weight: 800; pointer-events: auto; touch-action: none; }
.tc-b.b1 { left: 0; top: 0; } .tc-b.b2 { right: 0; top: 2.2em; } .tc-b.b3 { left: 1.6em; bottom: 0; } .tc-b.b4 { right: 0; bottom: 0; }
.tc-b.b1 { border-color: #ff9ad0; } .tc-b.b2 { border-color: #ffd06a; } .tc-b.b3 { border-color: #6ad7ff; } .tc-b.b4 { border-color: #7dff9a; }
.tc-b.on, .tc-m.on { background: rgba(255, 255, 255, .55); color: #000; }
.tc-macros { position: absolute; right: 3%; bottom: calc(8% + 17.5em); width: 17em; display: flex; flex-wrap: wrap; gap: .4em; justify-content: flex-end; pointer-events: none; }
.tc-m { padding: .55em .9em; border-radius: 2em; border: .15em solid rgba(255, 255, 255, .5); background: rgba(20, 24, 36, .5); color: #fff; font-weight: 700; font-size: .8em; pointer-events: auto; touch-action: none; }
.tc-m.heat { border-color: #ff9d1a; color: #ffb45a; }
.tc-pause { position: absolute; top: 1.5vh; right: 1.5vw; width: 2.6em; height: 2.6em; border-radius: 50%; border: .15em solid rgba(255, 255, 255, .5); background: rgba(20, 24, 36, .5); color: #fff; font-weight: 800; pointer-events: auto; z-index: 3; }

@media (max-aspect-ratio: 4/3) {
  .menu-list { width: 60vw; } .side-info { display: none; } .pcard { width: 40vw; } .tile { width: 9.5vh; height: 9.5vh; }
}

</style>
